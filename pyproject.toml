[project]
name = "crypto-momentum"
version = "0.1.0"
description = "Cross-sectional momentum research on crypto assets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=25.0.1",
]

[project.scripts]
momentum = "crypto_momentum.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_momentum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
