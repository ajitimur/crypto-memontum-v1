# Exclusion list v1 — Stablecoins and Wrapped Assets, by stated design intent.
#
# ADR-0006 is the decision this file implements: an asset is classified by the
# design intent it published on day one, and excluded for the whole sample. UST
# is here for every date it traded, including after May 2022, because its intent
# to hold a peg was knowable at listing and its depeg is not.
#
# Nothing here carries a date of its own. The date a symbol is classified on is
# its first tradeable date in the point-in-time Universe, read from archive
# coverage rather than typed in — so a classification cannot be applied earlier
# than the asset existed, and a listing that appears after `as_of` is reported
# as unclassified instead of being quietly judged by a list that never saw it.
#
# Deliberately absent: PAXG. Its peg is to a troy ounce of gold, not to a
# currency, so it has a real price series rather than a flat one. It is a
# commodity token in the cross-section, and excluding it needs its own argument.

version = "v1"
as_of = "2026-08-31"

